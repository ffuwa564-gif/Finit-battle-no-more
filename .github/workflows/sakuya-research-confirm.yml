name: Sakuya reviewed native confirmation (no deployment)

on:
  push:
    branches: [research/sakuya-this-girl-01]
    paths: [docs/media/this-girl/episodes/01/confirmation-approval.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        task: [main]
        stage: [ivory-tower-010, kuzuha-awakening]
        tier: [3, 4, 6]
        core: [F1, F4]
        include:
          - {task: growth, stage: supplementary, tier: 0, core: all}
          - {task: stress, stage: supplementary, tier: 0, core: all}
          - {task: hidden, stage: supplementary, tier: 0, core: all}
          - {task: noel, stage: supplementary, tier: 0, core: all}
          - {task: roster, stage: exploratory, tier: 0, core: all}
          - {task: landscape, stage: exploratory, tier: 0, core: all}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/this-girl-01/
            /docs/media/this-girl/episodes/01/
            /package.json
            /package-lock.json
            /tsconfig.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore immutable public baseline
        run: |
          git fetch --filter=blob:none --depth=1 origin f6595da6c5f4bd3950e412d92e3e08f3529e0706
          mkdir -p artifacts/this-girl-01/baseline
          git archive f6595da6c5f4bd3950e412d92e3e08f3529e0706 src | tar -xf - -C artifacts/this-girl-01/baseline
      - name: Require committed exact-lock review before any battle
        run: python3 scripts/this-girl-01/confirm-runner-provenance.py
        env:
          STUDY_TASK: ${{ matrix.task }}
          STUDY_STAGE: ${{ matrix.stage }}
          STUDY_TIER: ${{ matrix.tier }}
          STUDY_CORE: ${{ matrix.core }}
      - name: Execute only reviewed frozen conditions
        run: |
          LOCK_SHA=$(python3 -c 'import json; print(json.load(open("docs/media/this-girl/episodes/01/confirmation-approval.json"))["lockSha256"])')
          case "$STUDY_TASK" in
            main) node --import tsx scripts/this-girl-01/confirm.mts "$LOCK_SHA" "$STUDY_STAGE-T$STUDY_TIER-$STUDY_CORE" ;;
            growth|stress|hidden|noel) node --import tsx scripts/this-girl-01/supplementary.mts "$LOCK_SHA" "$STUDY_TASK" ;;
            roster|landscape) node --import tsx scripts/this-girl-01/exploratory.mts "$STUDY_TASK" ;;
            *) exit 1 ;;
          esac
        env:
          STUDY_TASK: ${{ matrix.task }}
          STUDY_STAGE: ${{ matrix.stage }}
          STUDY_TIER: ${{ matrix.tier }}
          STUDY_CORE: ${{ matrix.core }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sakuya-confirm-${{ matrix.task }}-${{ matrix.stage }}-T${{ matrix.tier }}-${{ matrix.core }}
          path: artifacts/this-girl-01/research/
          if-no-files-found: error
          retention-days: 30

# This file alone cannot start a confirmation push run. Only a separately
# committed approval JSON, created after the actual lock review, triggers it.
# The provenance step independently validates that approval and every source SHA.
