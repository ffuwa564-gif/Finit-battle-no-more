name: Sakuya native development search (no confirmation)

on:
  push:
    branches: [research/sakuya-this-girl-01]
    paths: [.github/workflows/sakuya-research-search.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        stage: [ivory-tower-010, kuzuha-awakening]
        tier: [6, 3, 4]
        core: [F1, F4]
        mode: [before, after]
        include:
          - {stage: ivory-tower-010, tier: 6, core: F5, mode: after}
          - {stage: kuzuha-awakening, tier: 6, core: F5, mode: after}
          - {stage: ivory-tower-010, tier: 6, core: global, mode: after}
          - {stage: kuzuha-awakening, tier: 6, core: global, mode: after}
          - {stage: ivory-tower-010, tier: 3, core: global, mode: after}
          - {stage: kuzuha-awakening, tier: 3, core: global, mode: after}
          - {stage: ivory-tower-010, tier: 4, core: global, mode: after}
          - {stage: kuzuha-awakening, tier: 4, core: global, mode: after}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/this-girl-01/
            /package.json
            /package-lock.json
            /tsconfig.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore immutable public baseline
        run: |
          git fetch --filter=blob:none --depth=1 origin f6595da6c5f4bd3950e412d92e3e08f3529e0706
          mkdir -p artifacts/this-girl-01/baseline
          git archive f6595da6c5f4bd3950e412d92e3e08f3529e0706 src | tar -xf - -C artifacts/this-girl-01/baseline
      - name: Record runtime and every native source hash
        run: python3 scripts/this-girl-01/search-runner-provenance.py
        env:
          STUDY_STAGE: ${{ matrix.stage }}
          STUDY_TIER: ${{ matrix.tier }}
          STUDY_CORE: ${{ matrix.core }}
          STUDY_MODE: ${{ matrix.mode }}
      - name: Native development and selection only
        run: |
          if [ "$STUDY_CORE" = global ]; then
            node --import tsx scripts/this-girl-01/global-search.mts "$STUDY_STAGE" "$STUDY_TIER"
          else
            node --import tsx scripts/this-girl-01/optimize.mts "$STUDY_STAGE" "$STUDY_TIER" "$STUDY_MODE" "$STUDY_CORE"
          fi
        env:
          STUDY_STAGE: ${{ matrix.stage }}
          STUDY_TIER: ${{ matrix.tier }}
          STUDY_CORE: ${{ matrix.core }}
          STUDY_MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sakuya-search-${{ matrix.mode }}-${{ matrix.stage }}-T${{ matrix.tier }}-${{ matrix.core }}
          path: |
            artifacts/this-girl-01/research/optimization/*.json.gz
            artifacts/this-girl-01/research/optimization-progress/*.json.gz
            artifacts/this-girl-01/research/global/*.json.gz
            artifacts/this-girl-01/research/runner-provenance.json
          if-no-files-found: error
          retention-days: 30

# Every runner executes one unmodified native search process. This workflow
# never opens held-out seed panels, creates a stage, uploads a game or merges.
# Import requires matching source hashes, all cases, and exact local overlap.
