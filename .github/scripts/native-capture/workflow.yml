# DRAFT / UNEXECUTED. This location is intentionally not an active workflow.
# Activate only by copying to .github/workflows after concrete capture approval.
name: Approved native A-C capture (no deployment)
on:
  push:
    branches: [research/sakuya-this-girl-01]
    paths: [docs/media/this-girl/episodes/01/capture-approval.json]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {arm: A, id: reference}
          - {arm: C, id: sakuya}
    env:
      CAPTURE_ARM: ${{ matrix.arm }}
      CAPTURE_ID: ${{ matrix.id }}
      CAPTURE_BASE_URL: http://127.0.0.1:4356
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore immutable public baseline
        run: |
          git fetch --filter=blob:none --depth=1 origin f6595da6c5f4bd3950e412d92e3e08f3529e0706
          mkdir -p artifacts/this-girl-01/baseline
          git archive f6595da6c5f4bd3950e412d92e3e08f3529e0706 src | tar -xf - -C artifacts/this-girl-01/baseline
      - name: Require exact capture approval and reviewed research lock
        run: |
          python3 .github/scripts/native-capture/gate.py
          python3 scripts/this-girl-01/confirm-runner-provenance.py
      - name: Install isolated runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb pulseaudio pulseaudio-utils ffmpeg x11-utils
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m pip install -r scripts/this-girl-01/requirements-media.txt
      - name: Reconstruct exact selected real-application proofs
        run: |
          RESEARCH_LOCK_SHA=$(python3 -c 'import json; print(json.load(open("docs/media/this-girl/episodes/01/capture-approval.json"))["lockSha256"])')
          export RESEARCH_LOCK_SHA
          node --import tsx scripts/this-girl-01/capture/prepare-selected.mts
          python3 .github/scripts/native-capture/gate.py --proof
      - name: Record one real arm on native X11 and PulseAudio
        run: bash .github/scripts/native-capture/run.sh
      - name: Preserve original bytes and portable artifact hashes
        if: always()
        run: python3 .github/scripts/native-capture/manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.arm }}-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/this-girl-01/capture/
            artifacts/this-girl-01/proofs/
            artifacts/this-girl-01/research/
            artifacts/this-girl-01/native-runner/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true
